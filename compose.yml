version: "3.8"

x-regex-ai-env: &regex-ai-env
  REGEX_AI_BASE_URL: ${REGEX_AI_BASE_URL:-https://ai-dev.grossmanbot.download/v1}
  REGEX_AI_MODEL: ${REGEX_AI_MODEL:-Qwen/Qwen3-4B-AWQ}
  REGEX_AI_TIMEOUT: "30"
  CF_ACCESS_CLIENT_ID: ${CF_ACCESS_CLIENT_ID}
  CF_ACCESS_CLIENT_SECRET: ${CF_ACCESS_CLIENT_SECRET}

services:
  grossman-api:
    image: liorgr/scenariobot-api:latest
    environment:
      <<: *regex-ai-env
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_KEY}
      JWT_SECRET: ${JWT_SECRET}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      APP_MODE: client

    ports:
      - target: 8000
        published: 8020
        protocol: tcp
        mode: ingress

    networks:
      - scenario_net

    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0

  backend:
    image: liorgr/scenariobot-api:latest

    environment:
      <<: *regex-ai-env
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      JWT_SECRET: ${JWT_SECRET}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_KEY}
      WA_ACCESS_TOKEN: ${WA_ACCESS_TOKEN}
      WA_VERIFY_TOKEN: ${WA_VERIFY_TOKEN}
      WA_PUBLIC_BASE: ${WA_PUBLIC_BASE}
      WA_GRAPH_VERSION: ${WA_GRAPH_VERSION}
      APP_MODE: ${APP_MODE}
      BACKEND_URL: https://backend.grossman.bot/api

      DEV_WORKER_URL: http://scenario-worker:9100
      WORKER_DEV_TIMEOUT: "30"

      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcs-key.json
      WA_APP_SECRET: ${WA_APP_SECRET}
      WA_DEBUG_TOKEN: ${WA_DEBUG_TOKEN}

    volumes:
      - /opt/fastapi-app/gcs-key.json:/run/secrets/gcs-key.json:ro

    ports:
      - target: 8000
        published: 8010
        protocol: tcp
        mode: ingress

    networks:
      - scenario_net

    deploy:
      replicas: 1

      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0

      update_config:
        order: start-first
        failure_action: rollback
        delay: 10s

      resources:
        limits:
          memory: 512M


  scenario-worker:
    image: liorgr/worker-scenario-runtime:latest

    environment:
      ASPNETCORE_URLS: http://+:9100
      PORT: "9100"

    networks:
      - scenario_net

    deploy:
      replicas: 1

      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0

      update_config:
        order: stop-first
        failure_action: rollback
        delay: 10s

      resources:
        limits:
          memory: 512M


networks:
  scenario_net:
    driver: overlay
    attachable: true
